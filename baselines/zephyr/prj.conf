# Normal Zephyr configuration; only subsystems the benchmark does not use are switched off.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_ADC=n
CONFIG_ENTROPY_GENERATOR=n
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_TIMESLICING=n
CONFIG_ASSERT=n
CONFIG_THREAD_MONITOR=n
CONFIG_PINCTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=n
# Per-thread CPU accounting through Zephyr's user tracing hooks (same method as the others).
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
